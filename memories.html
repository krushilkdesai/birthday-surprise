<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Our favorite memories together">
  <title>Some Memories 📸 | Birthday Surprise</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="memories">

  <div id="page-transition" class="page-transition" aria-hidden="true">
    <i class="bi bi-stars" aria-hidden="true"></i>
  </div>

  <div class="particles-container" data-particles="star" data-particle-count="10" aria-hidden="true"></div>

  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom fixed-top" aria-label="Main navigation">
    <div class="container">
      <a class="navbar-brand" href="index.html">✨ B</a>
    </div>
  </nav>

  <main class="page-wrapper">
    <section class="section-padding container" aria-labelledby="memories-heading">
      <h1 id="memories-heading" class="section-title fade-in-up">Some Memories 📸</h1>
      <p class="section-subtitle fade-in-up">Tap any card to relive the moment</p>

      <!-- Memory cards rendered by JavaScript from config.js -->
      <div id="memories-grid" class="row g-4"></div>

      <div class="text-center mt-5 fade-in-up">
        <a href="messages.html" class="btn-surprise">
          <span>Next: Things I Want to Say →</span>
        </a>
      </div>
    </section>
  </main>

  <!-- Memory Modal -->
  <div class="modal fade" id="memoryModal" tabindex="-1" aria-labelledby="modal-memory-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header border-0">
          <div>
            <span id="modal-memory-date" class="card-date"></span>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body pt-0">
          <img id="modal-memory-img" src="" alt="" class="modal-memory-img rounded-3 mb-3">
          <p id="modal-memory-desc" class="mb-0"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
