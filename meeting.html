<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Let's plan when we're actually meeting!">
  <title>Meeting Challenge 📅 | Birthday Surprise</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Polished Skip popup styles */
    #skip-popup {
      position: fixed;
      left: 50%;
      top: 18%;
      transform: translateX(-50%) translateY(-10px) scale(0.95);
      min-width: 320px;
      max-width: 420px;
      background: linear-gradient(135deg, rgba(111,66,193,0.98), rgba(255,111,155,0.95));
      color: #fff;
      padding: 14px 16px;
      border-radius: 12px;
      z-index: 10002;
      opacity: 0;
      transition: transform .35s cubic-bezier(.2,.9,.3,1), opacity .25s ease;
      box-shadow: 0 12px 30px rgba(15,15,30,0.45);
      backdrop-filter: blur(6px) saturate(1.1);
      -webkit-backdrop-filter: blur(6px) saturate(1.1);
      pointer-events: none;
      font-family: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    #skip-popup .skip-popup-inner {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #skip-popup .skip-icon {
      background: rgba(255,255,255,0.12);
      width: 52px;
      height: 52px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      box-shadow: inset 0 -4px 12px rgba(0,0,0,0.12);
    }
    #skip-popup .skip-title {
      font-weight: 700;
      font-size: 1.02rem;
      line-height: 1.05;
    }
    #skip-popup .skip-sub {
      font-size: 0.85rem;
      opacity: 0.92;
      margin-top: 2px;
    }
    #skip-popup.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
      pointer-events: auto;
      animation: popup-entrance .45s cubic-bezier(.2,.9,.3,1);
    }
    @keyframes popup-entrance {
      0% { transform: translateX(-50%) translateY(-8px) scale(0.96); opacity: 0; }
      60% { transform: translateX(-50%) translateY(6px) scale(1.02); opacity: 1; }
      100% { transform: translateX(-50%) translateY(0) scale(1); }
    }
    #skip-popup .skip-close {
      margin-left: auto;
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.95);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 6px 8px;
      border-radius: 8px;
      transition: background .15s ease, transform .12s ease;
    }
    #skip-popup .skip-close:hover { background: rgba(255,255,255,0.06); transform: translateY(-1px); }
    #skip-popup .skip-count {
      font-weight: 700;
      display: inline-block;
      min-width: 20px;
    }
  </style>
</head>
<body data-page="meeting">

  <div id="page-transition" class="page-transition" aria-hidden="true">
    <i class="bi bi-stars" aria-hidden="true"></i>
  </div>

  <div class="particles-container" data-particles="heart" data-particle-count="8" aria-hidden="true"></div>

  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom fixed-top" aria-label="Main navigation">
    <div class="container">
      <a class="navbar-brand" href="index.html">✨ B</a>
    </div>
  </nav>

  <main class="page-wrapper">
    <section class="section-padding container" aria-labelledby="meeting-heading">
      <h1 id="meeting-heading" class="section-title fade-in-up">Okay... Birthday Plans Are Not Enough 😌</h1>
      <p class="section-subtitle fade-in-up">So when are we actually meeting?</p>

      <div class="row justify-content-center">
        <div class="col-lg-7">
          <!-- Meeting Form -->
          <form id="meeting-form" class="meeting-form glass-card fade-in-up" novalidate>
            <div class="mb-3">
              <label for="meeting-date" class="form-label">Preferred Date</label>
              <input type="date" class="form-control" id="meeting-date" required aria-required="true">
            </div>
            <div class="mb-3">
              <label for="meeting-time" class="form-label">Preferred Time</label>
              <input type="time" class="form-control" id="meeting-time" required aria-required="true">
            </div>
            <div class="text-center">
              <button type="submit" class="btn-surprise btn-lg">
                <span>Confirm Meeting Date ✨</span>
              </button>
              <button type="button" id="skip-meeting-btn" class="btn-surprise btn-lg ms-2">
                <span>Skip</span>
              </button>
            </div>
          </form>

          <!-- Confirmation Card -->
          <div id="confirmation-card" class="confirmation-card glass-card mt-4">
            <h3>Meeting Date Locked! 🔒</h3>
            <p class="confirm-message">
              Looks like we're meeting on <strong id="confirm-date"></strong> at <strong id="confirm-time"></strong>. 👀
            </p>
            <p class="wait-text">But wait...</p>
          </div>

          <!-- Joke Reveal Section -->
          <div id="joke-section" class="joke-section mt-4">
            <p class="text-center fs-5 mb-4 fade-in-up">Wait... I forgot something.</p>

            <div class="text-center mb-4">
              <button id="reveal-joke-btn" class="btn-surprise" aria-label="Reveal the surprise joke">
                <span>Reveal It 👀</span>
              </button>
            </div>

            <div id="joke-card" class="joke-card">
              <p id="joke-text"></p>
            </div>

            <div class="text-center mt-4">
              <button id="last-thing-btn" class="btn-surprise hidden" aria-label="Go to final surprise">
                <span>Okay, One Last Thing →</span>
              </button>
            </div>
          </div>

          <!-- Skip popup (hidden by default) -->
          <div id="skip-popup" aria-hidden="true" role="status" aria-live="polite">
            <div class="skip-popup-inner">
              <div class="skip-icon" aria-hidden="true">😎🐼</div>
              <div class="skip-text">
                <div class="skip-title">labad date nakh ne</div>
                <div class="skip-sub">Auto closing in <span id="skip-count" class="skip-count">5</span>s</div>
              </div>
              <button id="skip-close" aria-label="Close" class="skip-close">×</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
