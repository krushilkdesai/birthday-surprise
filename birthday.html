<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Happy Birthday, Bestie! Time to celebrate!">
  <title>HAPPY BIRTHDAY! 🎉 | Birthday Surprise</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="birthday">

  <div id="page-transition" class="page-transition" aria-hidden="true">
    <i class="bi bi-stars" aria-hidden="true"></i>
  </div>

  <div class="particles-container" data-particles="star" data-particle-count="15" aria-hidden="true"></div>

  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom fixed-top" aria-label="Main navigation">
    <div class="container">
      <a class="navbar-brand" href="index.html">✨ B</a>
    </div>
  </nav>

  <main class="page-wrapper">
    <section class="section-padding container text-center" aria-labelledby="birthday-heading">
      <h1 id="birthday-heading" class="section-title fade-in-up">
        HAPPY BIRTHDAY, <span id="birthday-name">BESTIE</span>! 🎉
      </h1>
      <p class="section-subtitle fade-in-up">Today is officially your day.</p>

      <!-- CSS Birthday Cake -->
      <div class="cake-container fade-in-up" role="img" aria-label="Animated birthday cake with candles">
        <div class="candle" aria-hidden="true">
          <div class="candle-flame" aria-hidden="true"></div>
        </div>
        <div class="cake-base" aria-hidden="true"></div>
      </div>

      <button id="make-wish-btn" class="btn-surprise btn-lg fade-in-up" aria-label="Make a birthday wish">
        <span>Make a Wish 🎂</span>
      </button>

      <!-- Music Controls (no autoplay) -->
      <div class="music-controls fade-in-up">
        <button id="play-music-btn" class="btn-surprise btn-music" aria-label="Play birthday music">
          <span>🎵 Play Birthday Music</span>
        </button>
        <button id="pause-music-btn" class="btn-surprise btn-music hidden" aria-label="Pause birthday music">
          <span>⏸ Pause Music</span>
        </button>
      </div>

      <!-- Countdown -->
      <div class="mt-5 fade-in-up">
        <h2 class="h4 text-gradient mb-3">Countdown to Your Day</h2>
        <div id="countdown-grid" class="countdown-grid">
          <div class="countdown-item">
            <div id="countdown-days" class="countdown-number">00</div>
            <div class="countdown-label">Days</div>
          </div>
          <div class="countdown-item">
            <div id="countdown-hours" class="countdown-number">00</div>
            <div class="countdown-label">Hours</div>
          </div>
          <div class="countdown-item">
            <div id="countdown-minutes" class="countdown-number">00</div>
            <div class="countdown-label">Minutes</div>
          </div>
          <div class="countdown-item">
            <div id="countdown-seconds" class="countdown-number">00</div>
            <div class="countdown-label">Seconds</div>
          </div>
        </div>
        <p id="countdown-celebration" class="countdown-celebration hidden">It's Birthday Time! 🎉</p>
      </div>

      <div class="text-center mt-5">
        <a href="meeting.html" class="btn-surprise btn-outline-surprise">
          <span>Next:</span>
        </a>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
