<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A secret birthday surprise made just for you, bestie!">
  <title>Hey Bestie... 👀 | Birthday Surprise</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="welcome">

  <!-- Page Transition Overlay -->
  <div id="page-transition" class="page-transition" aria-hidden="true">
    <i class="bi bi-stars" aria-hidden="true"></i>
  </div>

  <!-- Floating Particles -->
  <div class="particles-container" data-particles="heart" data-particle-count="12" aria-hidden="true"></div>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom fixed-top" aria-label="Main navigation">
    <div class="container">
      <a class="navbar-brand" href="index.html">✨ B</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
              aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="memories.html">Memories</a></li>
          <li class="nav-item"><a class="nav-link" href="messages.html">Messages</a></li>
          <li class="nav-item"><a class="nav-link" href="birthday.html">Birthday</a></li>
          <li class="nav-item"><a class="nav-link" href="meeting.html">Meeting</a></li>
          <li class="nav-item"><a class="nav-link" href="surprise.html">Surprise</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <main class="page-wrapper">
    <section class="hero-fullscreen" aria-labelledby="welcome-heading">
      <div class="hero-content glass-card fade-in-up">
        <h1 id="welcome-heading" class="hero-title">Hey Bestie... 👀</h1>
        <p class="hero-subtitle" id="welcome-subtitle">I made something for you.</p>

        <button id="open-surprise-btn" class="btn-surprise btn-lg" aria-label="Open your birthday surprise">
          <span>Open Your Surprise ✨</span>
        </button>

        <p class="hero-footnote" id="welcome-footnote">Before you ask... yes, I actually spent time making this 😂</p>
      </div>

      <div class="scroll-indicator" aria-hidden="true">
        <span>scroll to explore</span>
        <i class="bi bi-chevron-double-down"></i>
      </div>
    </section>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/script.js"></script>
  <script>
    /* Apply config text on welcome page */
    document.addEventListener("DOMContentLoaded", () => {
      if (typeof birthdayConfig !== "undefined") {
        const sub = document.getElementById("welcome-subtitle");
        const foot = document.getElementById("welcome-footnote");
        if (sub) sub.textContent = birthdayConfig.welcomeSubtitle;
        if (foot) foot.textContent = birthdayConfig.welcomeFootnote;
      }
    });
  </script>
</body>
</html>
